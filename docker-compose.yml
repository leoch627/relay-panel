services:
  relay-panel:
    # 默认拉取 CI 发布的多架构镜像；想用本地源码构建就加 --build
    image: ghcr.io/leoch627/relay-panel:latest
    build: .
    container_name: relay-panel
    ports:
      - "8081:8081"          # 页面 / 面板 API / 节点轮询共用这一个端口
    volumes:
      - panel-data:/etc/relay-panel   # 状态/用户/规则/TLS 证书持久化
    environment:
      - PANEL_TLS=0                  # 套 CF/反代时保持 0（反代终止 TLS）；裸跑直连改 1
      # - PANEL_ADMIN_PASSWORD=请设置自己的密码  # 留空则自动生成，见容器日志
      # - PANEL_ADDR=:8081
    restart: unless-stopped

volumes:
  panel-data:
